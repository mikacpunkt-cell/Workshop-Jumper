name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Spieldateien einsortieren
        run: |
          mkdir -p _site/css _site/js _site/levels
          for f in index.html impressum.html datenschutz.html; do
            p=$(find . -name "$f" -not -path './_site/*' -not -path './.git/*' | head -1)
            [ -n "$p" ] && cp "$p" _site/
          done
          p=$(find . -name style.css -not -path './_site/*' | head -1)
          [ -n "$p" ] && cp "$p" _site/css/
          for n in speicher audio i18n einstellungen rangliste config online konto input grafik level player geist editor skineditor ui game; do
            p=$(find . -name "$n.js" -not -path './_site/*' -not -path './.git/*' -not -path './server/*' -not -path './werkzeuge/*' | head -1)
            [ -n "$p" ] && cp "$p" _site/js/
          done
          find . -name 'level[0-9]*.js' -not -path './_site/*' -not -path './.git/*' -not -path './werkzeuge/*' -exec cp {} _site/levels/ \;
          touch _site/.nojekyll
          find _site -type f | sort

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
